services:
  postgres:
    image: postgres:16.8-alpine
    container_name: docupro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docupro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docupro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7.4-alpine
    container_name: docupro-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-bullmq:
    image: redis:7.4-alpine
    container_name: docupro-redis-bullmq
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - redis-bullmq-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-19Z
    container_name: docupro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service ClamAV activable explicitement via profile 'antivirus'
  clamav:
    image: clamav/clamav:1.4
    container_name: docupro-clamav
    restart: unless-stopped
    profiles: ["antivirus"]
    ports:
      - "3310:3310"

volumes:
  postgres-data:
  redis-bullmq-data:
  minio-data:
